name: Feature request
description: Suggest a new capability or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - DOCX editor
        - Markdown editor
        - XLSX editor
        - PPTX editor
        - PDF editor
        - MCP live session
        - Plugin packaging
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Alternatives you considered are welcome too.
