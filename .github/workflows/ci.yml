name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Lite workspace dependencies
        run: npm ci --ignore-scripts

      - name: Fetch pinned upstream provenance
        run: npm run upstream:fetch

      - name: Check dependency licenses
        run: npm run licenses

      - name: Verify product boundary, types, tests, and package
        run: npm run check

      - name: Install Chromium for Codex host visual regression
        run: npx playwright install --with-deps chromium

      - name: Verify Codex host width matrix
        run: npm run test:visual:host

      - name: Verify packaged MCP contract
        run: npm run smoke:mcp
